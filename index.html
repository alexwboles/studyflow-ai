<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow — AI study planner with spaced repetition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="container header-inner">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 21v-7m0 0c0-4.5-3.5-8-8.5-9 .8 5.5 4 8.5 8.5 9zm0 0c0-4.5 3.5-8 8.5-9-.8 5.5-4 8.5-8.5 9z"/></svg>StudyFlow</div>
    <p class="tagline">Spaced repetition, minus the cramming.</p>
  </div>
</header>

<nav id="tabs" aria-label="StudyFlow views">
  <div class="container tabs-inner">
    <button id="tab-setup" data-tab="setup">Setup</button>
    <button id="tab-today" data-tab="today">Today</button>
    <button id="tab-schedule" data-tab="schedule">Schedule</button>
    <button id="tab-progress" data-tab="progress">Progress</button>
    <button id="tab-cards" data-tab="cards">Flashcards</button>
  </div>
</nav>

<main class="container">
  <section id="view-setup" class="view"></section>
  <section id="view-today" class="view"></section>
  <section id="view-schedule" class="view"></section>
  <section id="view-progress" class="view"></section>
  <section id="view-cards" class="view"></section>
</main>

<footer>
  <div class="container">
    <p class="muted small">StudyFlow runs 100% in your browser. Your plan never leaves this device.</p>
  </div>
</footer>

<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
